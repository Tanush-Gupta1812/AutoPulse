version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autopulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: autopulse
      POSTGRES_USER: autopulse
      POSTGRES_PASSWORD: autopulse123
    ports:
      - "5432:5432"
    volumes:
      - autopulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopulse -d autopulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autopulse-network

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: autopulse-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://autopulse:autopulse123@db:5432/autopulse
      PROJECT_NAME: "AutoPulse API"
      VERSION: "1.0.0"
    ports:
      - "8000:8000"
    networks:
      - autopulse-network

  # Optional Dev Profile for PgAdmin database explorer
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autopulse-pgadmin
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@autopulse.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - autopulse-network

volumes:
  autopulse_pgdata:
    name: autopulse_pgdata

networks:
  autopulse-network:
    name: autopulse-network
    driver: bridge
